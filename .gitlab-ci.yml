default:
  image: docker:27.0
  services:
    # MTU workaround for GitLab hosted runners (esp. Arm + DinD).
    - name: docker:27.0-dind
      command: ["--mtu=1400"]

stages:
  - build
  - manifest
  - distribute

variables:
  # Empty tag will become the tag "latest".
  IMAGE_TAG: ""

.build:
  stage: build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # If not in master, use branch name with any ".x" suffixes removed.
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_TAG=":$(echo "$CI_COMMIT_REF_NAME" | sed 's/\.x$//')"
      else
        IMAGE_TAG=":latest"
      fi
      docker build --pull -t "${CI_REGISTRY_IMAGE}${IMAGE_TAG}-${ARCH}" .
      docker push "${CI_REGISTRY_IMAGE}${IMAGE_TAG}-${ARCH}"

build:amd64:
  extends: .build
  variables:
    ARCH: amd64
  tags:
    - saas-linux-small-amd64

build:arm64:
  extends: .build
  variables:
    ARCH: arm64
  tags:
    - saas-linux-small-arm64

manifest:
  stage: manifest
  needs:
    - build:amd64
    - build:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_TAG=":$(echo "$CI_COMMIT_REF_NAME" | sed 's/\.x$//')"
      else
        IMAGE_TAG=":latest"
      fi
      docker buildx imagetools create \
        -t "${CI_REGISTRY_IMAGE}${IMAGE_TAG}" \
        "${CI_REGISTRY_IMAGE}${IMAGE_TAG}-amd64" \
        "${CI_REGISTRY_IMAGE}${IMAGE_TAG}-arm64"

distribute:
  stage: distribute
  before_script:
    - docker login -u "$EXT_REGISTRY_USER" -p "$EXT_REGISTRY_PASSWORD" "$EXT_REGISTRY"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_TAG=":$(echo "$CI_COMMIT_REF_NAME" | sed 's/\.x$//')"
      else
        IMAGE_TAG=":latest"
      fi
      docker buildx imagetools create -t "${EXT_REGISTRY_IMAGE}${IMAGE_TAG}" "${CI_REGISTRY_IMAGE}${IMAGE_TAG}"
  only:
    variables:
      - $EXT_REGISTRY
